[pytest]
DJANGO_SETTINGS_MODULE = api.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --strict-markers
    --tb=short
    --reuse-db
testpaths =
    orders/tests
    payments/tests
markers =
    django_db: Mark test as requiring database access
    slow: Mark test as slow running
