<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Confirme seu e-mail</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f5f5f5; padding:20px;">

  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table width="600" style="background:#ffffff; padding:30px; border-radius:8px;">
          <tr>
            <td align="center">
              <h2 style="color:#333;">Confirme seu e-mail</h2>
              <p>Olá <strong>{{ user.get_full_name|default:user.email }}</strong>,</p>

              <p>
                Obrigado por se cadastrar. Para ativar sua conta,
                clique no botão abaixo:
              </p>

              <p style="margin:30px 0;">
                <a href="{{ activate_url }}"
                   style="background:#4F46E5; color:#ffffff;
                          padding:12px 24px; text-decoration:none;
                          border-radius:6px;">
                  Confirmar e-mail
                </a>
              </p>

              <p style="font-size:12px; color:#666;">
                Se você não solicitou este cadastro, ignore este e-mail.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

</body>
</html>
