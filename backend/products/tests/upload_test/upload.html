<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Teste Upload Marketplace</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    label { font-weight: bold; }
    input, select { margin-bottom: 8px; }
    button { margin-top: 10px; padding: 8px 16px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
    .env-toggle { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
    .env-toggle button { padding: 6px 14px; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
    .env-toggle button.active { background: #007bff; color: #fff; border-color: #007bff; }
  </style>
</head>
<body>
  <h2>Upload de imagem - Listing</h2>

  <label>Ambiente</label>
  <div class="env-toggle">
    <button id="envLocal" onclick="setEnv('local')">Local (localhost:5000)</button>
    <button id="envProd" onclick="setEnv('prod')">Produção (api.megdev.com.br)</button>
  </div>
  <small>API: <span id="apiDisplay">-</span></small>

  <br /><br />

  <label>JWT Token</label><br />
  <input type="text" id="token" style="width:100%" placeholder="Cole o access token aqui" />

  <br /><br />

  <label>ID do Listing</label><br />
  <input type="number" id="listingId" placeholder="Ex: 42" />

  <br /><br />

  <input type="file" id="fileInput" accept="image/*" />

  <br />
<button id="uploadBtn" type="button">Enviar imagem</button>

  <pre id="output"></pre>

  <script src="upload.js"></script>
</body>
</html>
